<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Carrito de compras</title>
  <link rel="icon" href="favicon.ico">
  <link rel="stylesheet" href="styles.css">
</head>

<body>

  <header>
    <img src="imagenes/logo.png" alt="Logo de la página" class="logo" width="128" height="128">
    <h1>Carrito</h1>
    <button class="btn-hamburguesa">☰</button>
    <nav>
      <ul id="menu-lista">
        <li><a href="index.html">Catálogo</a></li>
        <li><a href="carrito.html">Carrito</a></li>
        <li><a href="historial.html">Historial</a></li>
      </ul>
    </nav>
  </header>

<main>

  <section class="carrito">

    <h2>Tu carrito de compras</h2>

    <table>
     <thead>
       <tr>
          <th>Producto</th>
          <th>Precio</th>
          <th>Cantidad</th>
          <th>Subtotal</th>
          <th>Acción</th>
        </tr>
      </thead>

      <tbody id="lista-carrito">
      
      </tbody>
    </table>

    <div class="resumen-carrito">

      <h3>Total: <span id="total-carrito">$0</span></h3>

      <button id="btn-comprar" type="button">
        Finalizar compra
      </button>

      <a href="index.html" id="seguir-comprando">
        Seguir comprando
      </a>

    </div>

  </section>

</main>


  

  <script src="app.js"></script>

</body>
</html>

<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>comprar</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header>
    <h1>Carrito</h1>
    <button class="btn-hamburguesa">☰</button>
    <nav>
      <ul id="menu-lista">
        <li><a href="index.html">Catálogo</a></li>
        <li><a href="carrito.html">Carrito</a></li>
        <li><a href="historial.html">Historial</a></li>
      </ul>
    </nav>
  </header>
  <main>
    <h2>Finalizar Compra</h2>
    <form id="formulario-compra" novalidate>
    <fieldset>
      <legend>Datos Personales</legend>
        <div>
          <label for="nombre">Nombre y Apellido:</label>
          <input type="text" id="nombre" name="nombre" required placeholder="Ej. Juan Giusti">
          <span class="mensaje-error" id="error-nombre"></span>
        </div>
        <div>
          <label for="email">Correo Electrónico:</label>
          <input type="email" id="email" name="email" required placeholder="ejemplo@correo.com">
          <span class="mensaje-error" id="error-email"></span>
        </div>
        <div>
          <label for="telefono">Teléfono de Contacto:</label>
          <input type="tel" id="telefono" name="telefono" required placeholder="3411234567">
          <span class="mensaje-error" id="error-telefono"></span>
        </div>
      </fieldset>
      <fieldset>
        <legend>Método de Envío y Pago</legend>
        <div>
          <label for="metodo-envio">Forma de Envío:</label>
          <select id="metodo-envio" name="metodoEnvio" required>
            <option value="">-- Seleccionar opción --</option>
            <option value="domicilio">Envío a Domicilio</option>
            <option value="sucursal">Retiro en Sucursal</option>
          </select>
          <span class="mensaje-error" id="error-envio"></span>
        </div>
        <div>
          <label for="fecha-entrega">Fecha de entrega(De a 2 a 10 dias de la compra)//Fecha de retiro:</label>
          <input type="date" id="fecha-entrega" name="fechaEntrega" required>
          <span class="mensaje-error" id="error-fecha"></span>
        </div>
        <div class="grupo-radio">
          <p>Medio de Pago:</p>
          <label>
            <input type="radio" name="medioPago" value="tarjeta" required>
            Tarjeta de Crédito / Débito
          </label>
          <label>
            <input type="radio" name="medioPago" value="transferencia">
            Transferencia Bancaria
          </label>
          <label>
            <input type="radio" name="medioPago" value="efectivo">
            Efectivo al retirar
          </label>
          <span class="mensaje-error" id="error-pago"></span>
        </div>
      </fieldset>
      <fieldset>
        <legend>Preferencias y Términos</legend>

        <div class="grupo-checkbox">
          <p>Opciones adicionales:</p>
          <label>
            <input type="checkbox" name="intereses" value="notificaciones">
            Recibir ofertas y novedades por email
          </label>
          <label>
            <input type="checkbox" name="intereses" value="empaqueRegalo">
            Solicitar empaque para regalo
          </label>
        </div>

        <div>
          <label>
            <input type="checkbox" id="terminos" name="terminos" required>
            Acepto los términos y condiciones de compra
          </label>
          <span class="mensaje-error" id="error-terminos"></span>
        </div>
      </fieldset>
      <button type="submit" id="btn-comprar">Confirmar y Guardar Compra</button>
    </form>
  </main>
  <footer></footer>
  <script src="app.js"></script>
</body>
</html>
